name: Import and deploy Yukio website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Import the verified website snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/yukio-source.zip" \
              https://github.com/leo-zhang-source/yukio-website/releases/download/website-20261030/yukio-website-source-20261030.zip
            echo "813f5b143d4862a3eb4e8ea19c0dbf78b0c88f02c28802c3e035c1d9cca548e5  $RUNNER_TEMP/yukio-source.zip" | sha256sum --check -
            unzip -oq "$RUNNER_TEMP/yukio-source.zip" -d "$GITHUB_WORKSPACE"
            npm run check
            npm run test:physics
            npm run test:demo
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m 'Import complete verified Yukio website'
            git push origin HEAD:main
          fi
      - name: Validate website and installer
        run: |
          npm run check
          npm run test:physics
          npm run test:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
